kind = "web"
previewPath = "/"
title = "Crochet Boutique Showcase"
description = "A polished personal crochet showcase where visitors browse handmade creations and inquire directly, with a protected admin panel for managing products, categories, contacts, and site content."
version = "1.0.0"
id = "artifacts/crochet-boutique"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22947

[services.development]
run = "pnpm --filter @workspace/crochet-boutique run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/crochet-boutique", "run", "build" ]
serve = "static"
publicDir = "artifacts/crochet-boutique/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22947"
BASE_PATH = "/"
